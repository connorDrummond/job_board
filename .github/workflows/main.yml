name: Weekly Job Scraper

on:
  schedule:
    - cron: "0 10 * * 3"   # Wednesday at 10:00 UTC
  workflow_dispatch:

jobs:
  scrape-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas sqlalchemy psycopg2-binary
          python -m pip install git+https://github.com/speedyapply/JobSpy.git
      - name: Debug Python environment
        run: |
          echo "Python path:"
          which python
          echo "Python version:"
          python --version
          echo "Installed packages:"
          python -m pip list
      - name: Inspect installed modules
        run: |
          python -c "import pkgutil; print([m.name for m in pkgutil.iter_modules()])"
      - name: Verify jobspy import
        run: |
          python -c "import jobspy; print('jobspy import works')"

      - name: Run scraper
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python web_scrape.py

      - name: Upload logs (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs
          path: |
            *.log
            *.txt
          if-no-files-found: ignore